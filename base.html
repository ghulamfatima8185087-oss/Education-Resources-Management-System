<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>college management system</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>    

      .brand {
          color: #FF9138;
      }

      .border-hover {
          border-top: 5px solid transparent;
          transform: translateY(-4px);
      }

      .border-hover:hover {
          border-top: 5px solid #ff9138;
          transform: translateY(-4px);
      }

      #sign-in {
          background: #FF9138;
          border-top-left-radius: 50px;
          border-bottom-left-radius: 50px;
      }

      .navbar-toggler {
          border: 3px solid #FF9138;
      }

      .navbar-toggler:focus {
          box-shadow: none;
      }

      @media screen and (max-width : 992px) {
          #nav-length {
              width: 100%;
          }

          .border-hover {
              border-top: 0;
          }

          .border-hover:hover {
              border-top: 0;
          }

          #sign-in {
              border-radius: 50px;
          }
      }
      /* body section */
      .icon-height {
          height: 28px;
          width: 28px;
      }

      .icon-container {
          background: #FF9138;
      }

      .dark-background {
          background: #2b3944;
      }
      #socialWrap {
          border-radius: 0px 24px 24px 0px;
      }
      {% block style %}{% endblock style %}
    </style>
  </head>
  <body class="bg-black text-white">
    <nav>
      <div class="navbar navbar-expand-lg pt-4">
          <div class="container-fluid">
              <a href="#" class="brand text-decoration-none d-block  fw-bold fs-1 ">College</a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                  data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                  aria-expanded="false" aria-label="Toggle navigation">
                  <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse justify-content-end" id="navbarSupportedContent">
                  <ul id="nav-length" class="navbar-nav justify-content-between border-top border-2 text-center">
                      <li class="nav-item">
                          <a href="/" class="nav-link border-hover py-3 text-white">Home</a>
                      </li>
                      
                      {% if request.user.is_authenticated %}
                      <li class="nav-item">
                        <a class="nav-link border-hover py-3 text-white" aria-current="page" href="{% url 'attendances' %}">Attendances</a>
                      </li>
                      <li class="nav-item">
                        <a class="nav-link border-hover py-3 text-white" aria-current="page" href="{% url 'result' %}">Result</a>
                      </li>
                      <li class="nav-item">
                        <a class="nav-link border-hover py-3 text-white" aria-current="page" href="{% url 'exams' %}">Exams</a>
                      </li>
                      <li class="nav-item">
                        <a class="nav-link border-hover py-3 text-white" aria-current="page" href="{% url 'schedules' %}">Schedules</a>
                      </li>
                      <li class="nav-item">
                        <a class="nav-link border-hover py-3 text-white" aria-current="page" href="{% url 'student' %}">student</a>
                      </li>
                      
                      <li class="nav-item">
                        <a href="{% url 'signout' %}" id="sign-in" class="nav-link my-2 px-4 text-white">
                          <i class="fa-regular fa-circle-user"></i>
                          SignOut
                        </a>
                      </li>
                      {% else %}
                      <li class="nav-item">
                        <a href="{% url 'signin' %}" id="sign-in" class="nav-link my-2 px-4 text-white">
                          <i class="fa-regular fa-circle-user"></i>
                            SignIn
                        </a>
                      </li>
                      
                      {% endif %}
                  </ul>
              </div>
          </div>
      </div>
  </nav>
    
      {% block content %}{% endblock content %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
  </body>
</html>
